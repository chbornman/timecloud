[package]
name = "timecloud"
version = "0.1.0"
edition = "2021"
description = "Animated word cloud videos with physics-based layout"
license = "MIT"
repository = "https://github.com/chbornman/timecloud"
readme = "README.md"
keywords = ["wordcloud", "visualization", "animation", "video"]
categories = ["multimedia::video", "visualization", "command-line-utilities"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Text Processing
regex = "1"
rust-stemmers = "1.2"

# Image Generation
image = "0.25"
ab_glyph = "0.2"
imageproc = "0.25"

# Parallelism
rayon = "1.10"

# Utilities
thiserror = "2"
anyhow = "1"
indicatif = "0.17"
tempfile = "3"
rand = "0.8"
kamadak-exif = "0.6"
